build:
  stage: build
  # Stay on Maven 3.9 for now,
  # because Tycho 5 is currently incompatible with Maven 3.10:
  # https://github.com/eclipse-tycho/tycho/issues/6399
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -Dmaven.repo.local="$CI_PROJECT_DIR/maven_repo_local" -f org.eventb.texteditor.parent/pom.xml install
  cache:
    paths:
      - maven_repo_local
  artifacts:
    paths:
      - org.eventb.texteditor.repository/target/repository

deploy:
  stage: deploy
  rules:
    - if: $CI_PROJECT_PATH == "general/stups/camille" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG =~ /\d+\.\d+\..+/)
  image: alpine:3
  variables:
    GIT_STRATEGY: none
    lftp_setup: "set cmd:fail-exit true; set sftp:auto-confirm true; open --user ${DEPLOY_USERNAME} --env-password sftp://${DEPLOY_HOST}/${DEPLOY_REMOTE_BASEDIR}/rodin/camille/"
  before_script:
    - apk update
    - apk add lftp openssh-client
  script:
    - |
      if [ -z "${CI_COMMIT_TAG-}" ]
      then
        LFTP_PASSWORD="${DEPLOY_PASSWORD}" lftp -c "$lftp_setup; mirror -vvv -R --delete org.eventb.texteditor.repository/target/repository develop"
      else
        release_dir_name="release-${CI_COMMIT_TAG}"
        echo "Uploading release to ${release_dir_name}..."

        deployment/generate_htaccess.sh "${release_dir_name}" > .htaccess
        LFTP_PASSWORD="${DEPLOY_PASSWORD}" lftp -c "$lftp_setup; mkdir release_temp; mirror -vvv -R org.eventb.texteditor.repository/target/repository release_temp; mv release_temp ${release_dir_name}; put .htaccess"
      fi
